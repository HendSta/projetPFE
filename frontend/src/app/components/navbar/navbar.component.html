<nav class="sticky top-0 z-50 navbar bg-gradient-to-r from-indigo-900/90 to-blue-800/90 backdrop-blur-md text-white p-3 border-b border-indigo-300/20 
     shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-br-xl w-full transform hover:-translate-y-1 transition-all duration-300">
  <div class="navbar-start">
    <a class="flex items-center gap-3">
      <div class="bg-white p-2 rounded-full shadow-[0_4px_10px_rgba(67,56,202,0.3)]">
        <lucide-icon name="stethoscope" class="h-7 w-7 text-indigo-700" [strokeWidth]="1.5"></lucide-icon>
      </div>
      <div class="transform hover:translate-y-[-2px] transition-transform">
        <div class="flex items-baseline">
          <span class="text-xl font-bold">MedWin</span>
          <lucide-icon name="activity" class="h-4 w-4 mx-1.5 text-indigo-200"></lucide-icon>
        </div>
        <span class="text-sm text-white/90 dark:text-white/80 block -mt-1">{{ 'NAVBAR_SUBTITLE' | translate }}</span>
      </div>
    </a>
  </div>
  
  <div class="navbar-end flex items-center gap-4">
    <div class="bg-indigo-700/40 p-1.5 rounded-lg border border-indigo-300/20 shadow-md transform hover:scale-105 transition-transform">
      <label class="swap swap-rotate">
        <input type="checkbox" (change)="onToggleTheme()" [checked]="isDarkMode" />
        <div class="swap-on">
          <lucide-icon name="sun" class="h-5 w-5 text-yellow-200"></lucide-icon>
        </div>
        <div class="swap-off">
          <lucide-icon name="moon" class="h-5 w-5 text-indigo-100"></lucide-icon>
        </div>
      </label>
    </div>
    
    <!-- Sélecteur de langue -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-sm bg-indigo-700/40 border border-indigo-300/20 text-white shadow-sm transition-all hover:shadow-md flex items-center gap-2">
        <span class="text-sm">{{ translate.currentLang === 'fr' ? 'Français' : 'English' }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
      <ul tabindex="0" class="dropdown-content z-[1] menu p-1 shadow-xl bg-base-100 rounded-box w-fit min-w-[6rem] dark:bg-gray-700">
        <li [class.active]="translate.currentLang === 'en'"><a (click)="switchLang('en')" class="text-xs text-gray-800 dark:text-white hover:bg-indigo-500 dark:hover:bg-indigo-800 active:bg-indigo-600 dark:active:bg-indigo-700 active:text-white">English</a></li>
        <li [class.active]="translate.currentLang === 'fr'"><a (click)="switchLang('fr')" class="text-xs text-gray-800 dark:text-white hover:bg-indigo-500 dark:hover:bg-indigo-800 active:bg-indigo-600 dark:active:bg-indigo-700 active:text-white">Français</a></li>
      </ul>
    </div>
    
    <app-signin></app-signin>
  </div>
</nav>
